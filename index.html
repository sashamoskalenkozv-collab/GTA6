<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTA VI | Countdown</title>
    <link rel="stylesheet" href="stael.css" />
</head>

<body>
    <div class="bg-glow glow-left"></div>
    <div class="bg-glow glow-right"></div>

    <main class="countdown-card">
        <p class="eyebrow">official release countdown</p>
        <h1>GTA VI</h1>
        <p class="release-date">19 листопада • 12:00</p>

        <div class="countdown" aria-label="таймер до релізу">
            <div class="time-box">
                <span id="days">00</span>
                <small>днів</small>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <small>годин</small>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <small>хвилин</small>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <small>секунд</small>
            </div>
        </div>

        <p class="status">До релізу залишилось</p>
    </main>

    <script src="srept.js"></script>
</body>

</html>
